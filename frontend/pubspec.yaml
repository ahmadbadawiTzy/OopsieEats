name: oopsieeats
description: "OopsieEats - Food Nutrition Recognition & Daily Tracking App"
publish_to: 'none'
version: 1.0.0+2002

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  tflite_flutter: ^0.12.1
  image: ^4.12.0
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/data/
    - assets/images/
    - assets/images/about/
    - assets/onboarding/photos/
    - assets/onboarding/food/
